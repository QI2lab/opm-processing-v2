name: Documentation

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "docs/**"
      - "tests/CONTRIBUTING.md"
      - "mkdocs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/CONTRIBUTING.md"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  # A PR update with unchanged docs must not cancel the previous docs build.
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: Check documentation and build if changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check documentation changes in this push
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BEFORE_SHA" ]]; then
            BEFORE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA=$(git hash-object -w -t tree /dev/null)
          elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE_SHA"
          fi
          if git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- docs/ tests/CONTRIBUTING.md mkdocs.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up uv and Python
        if: steps.changes.outputs.changed == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          uv venv .venv-docs --python 3.12
          uv --no-config pip install --python .venv-docs --group docs --index-url https://pypi.org/simple
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
      - name: Build documentation
        if: steps.changes.outputs.changed == 'true'
        run: uv run --python .venv-docs --no-project mkdocs build --clean --strict
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: Deploy documentation
    if: needs.build.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
