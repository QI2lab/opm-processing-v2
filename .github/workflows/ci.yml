name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

# cancel in-progress runs that use the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cpu:
    name: CPU / ${{ matrix.platform }} (${{ matrix.python-version }})
    # Opening a PR starts the draft workflow; wait until it is ready for review.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'opened' && github.event.pull_request.draft == false)
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        platform: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-path: "pyproject.toml"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install -U pip
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --group dev ".[processing]"
          python -m pip install --no-deps "opm-v2 @ git+https://github.com/QI2lab/opm-v2@ae059d962835520bf2c1b37edbb335bf5e617b23"

      - name: 🧪 Run Tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest tests/cpu --strict-markers -p pytest_cov --color=yes --cov --cov-report=xml --cov-report=term-missing

      - name: Coverage
        uses: codecov/codecov-action@v7
