name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

# cancel in-progress runs that use the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cpu:
    name: CPU / ${{ matrix.platform }} (${{ matrix.python-version }})
    # Opening a PR starts the draft workflow; wait until it is ready for review.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'opened' && github.event.pull_request.draft == false)
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        platform: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-path: "pyproject.toml"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install -U pip
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --group dev ".[processing]"
          python -m pip install --no-deps "opm-v2 @ git+https://github.com/QI2lab/opm-v2@ae059d962835520bf2c1b37edbb335bf5e617b23"

      - name: 🧪 Run Tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          CUDA_VISIBLE_DEVICES: "-1"
        run: >-
          python -m pytest
          tests/cpu/test_camera.py
          tests/cpu/test_camera_likelihood.py
          tests/cpu/test_acquisition_deconvolution.py
          tests/cpu/test_coordinate_origins.py
          tests/cpu/test_deconvolution_metadata.py
          tests/cpu/test_depth_intensity_normalization.py
          tests/cpu/test_fusion_storage.py
          tests/cpu/test_opm_simulation.py
          tests/cpu/test_opmpsf.py
          tests/cpu/test_opmtools.py
          tests/cpu/test_physical_forward_model.py
          tests/cpu/test_position_coordinate_metadata.py
          tests/cpu/test_processing_state.py
          tests/cpu/test_registration_geometry.py
          tests/cpu/test_registration_optimization.py
          tests/cpu/test_registration_periodic.py
          tests/cpu/test_registration_retries.py
          tests/cpu/test_tilefusion.py
          tests/cpu/test_time_axis_metadata.py::test_written_time_axis_interval_and_units
          tests/cpu/test_time_axis_metadata.py::test_unknown_time_does_not_become_one_second
          tests/cpu/test_time_axis_metadata.py::test_hardware_channel_periods_sum_once
          tests/cpu/test_time_axis_metadata.py::test_time_reader_converts_units_and_requires_consistent_levels
          tests/cpu/test_roi.py::test_world_roi_maps_to_skewed_scan_x_and_keeps_all_camera_y
          tests/cpu/test_roi.py::test_registered_tile_origin_is_selected_per_timepoint
          tests/cpu/test_roi.py::test_roi_plan_keeps_raw_origin_clipped_halos_and_refined_extent
          tests/cpu/test_roi.py::test_roi_registration_context_keeps_selection_limits
          tests/cpu/test_cli_helpers.py::test_channel_checkpoint_requires_a_successful_write
          "tests/cpu/test_opm_v2_dataset.py::test_projection_output_preserves_calibration_geometry_and_provenance[projection-source-dir-uint16]"
          "tests/cpu/test_opm_v2_dataset.py::test_projection_output_preserves_calibration_geometry_and_provenance[stage-source-dir-float32]"
          "tests/cpu/test_opm_v2_dataset.py::test_projection_output_preserves_calibration_geometry_and_provenance[selected-positions-output-dir-float32]"
          tests/cpu/test_opm_v2_dataset.py::test_projection_cli_resume_preserves_completed_pixels
          -k "not test_large_noisy_deskew_preserves_scientific_bounds_across_tiles and not test_saved_deskew_retains_complete_z_extent"
          --strict-markers -p pytest_cov --color=yes --cov --cov-report=xml --cov-report=term-missing --junitxml=cpu-core.xml

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpu-${{ matrix.platform }}
          path: |
            cpu-*.xml
            coverage.xml

      - name: Coverage
        uses: codecov/codecov-action@v7
