<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OPM processing and fusion workflow</title>
<style>
  @page { size: 8.5in 5.5in; margin: 0; }
  html, body { width: 8.5in; height: 5.5in; margin: 0; background: white; }
  svg { display: block; width: 8.5in; height: 5.5in; }
  text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
  .group { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
  .node { fill: white; stroke: #334155; stroke-width: 1.5; }
  .optional { fill: #f1f5f9; }
  .group-label { font-size: 17px; font-weight: 700; }
  .label { font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
  .note { font-size: 11.5px; font-style: italic; text-anchor: middle; }
  .arrow { fill: none; stroke: #334155; stroke-width: 1.7; marker-end: url(#arrowhead); }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 528" role="img"
     aria-label="Workflow for OPM processing and fusion">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="group" x="32" y="55" width="752" height="210" rx="8"/>
  <text class="group-label" x="50" y="84">process</text>

  <rect class="node" x="52" y="124" width="104" height="82" rx="5"/>
  <text class="label" x="104" y="157">
    <tspan x="104" dy="-8">OPM</tspan>
    <tspan x="104" dy="19">acquisition</tspan>
  </text>

  <rect class="node optional" x="176" y="114" width="154" height="102" rx="5"/>
  <text class="label" x="253" y="148">
    <tspan x="253" dy="-9">Illumination</tspan>
    <tspan x="253" dy="19">correction</tspan>
  </text>
  <text class="note" x="253" y="190">
    <tspan x="253">optional: load or estimate</tspan>
  </text>

  <rect class="node optional" x="350" y="124" width="126" height="82" rx="5"/>
  <text class="label" x="413" y="155">Deconvolution</text>
  <text class="note" x="413" y="184">optional</text>

  <rect class="node" x="496" y="124" width="92" height="82" rx="5"/>
  <text class="label" x="542" y="165">Deskew</text>

  <rect class="node" x="608" y="124" width="152" height="82" rx="5"/>
  <text class="label" x="684" y="157">
    <tspan x="684" dy="-8">Processed</tspan>
    <tspan x="684" dy="19">position tiles</tspan>
  </text>

  <path class="arrow" d="M156 165 H176"/>
  <path class="arrow" d="M330 165 H350"/>
  <path class="arrow" d="M476 165 H496"/>
  <path class="arrow" d="M588 165 H608"/>

  <rect class="group" x="32" y="305" width="752" height="165" rx="8"/>
  <text class="group-label" x="50" y="334">fuse</text>

  <rect class="node" x="154" y="359" width="138" height="72" rx="5"/>
  <text class="label" x="223" y="387">
    <tspan x="223" dy="-7">Tile</tspan>
    <tspan x="223" dy="19">registration</tspan>
  </text>

  <rect class="node" x="347" y="359" width="122" height="72" rx="5"/>
  <text class="label" x="408" y="387">
    <tspan x="408" dy="-7">Volume</tspan>
    <tspan x="408" dy="19">fusion</tspan>
  </text>

  <rect class="node" x="524" y="349" width="204" height="92" rx="5"/>
  <text class="label" x="626" y="387">
    <tspan x="626" dy="-17">Fused volume</tspan>
    <tspan x="626" dy="20">and max-Z</tspan>
    <tspan x="626" dy="20">projection</tspan>
  </text>

  <path class="arrow" d="M292 395 H347"/>
  <path class="arrow" d="M469 395 H524"/>
  <path class="arrow" d="M684 206 V285 H223 V359"/>
</svg>
</body>
</html>
